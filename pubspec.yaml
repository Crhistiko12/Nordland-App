name: nordland_puntos_venta
description: "Tienda oficial Nordland para comprar, revender y encontrar puntos de venta."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  google_fonts: ^9.0.0
  cupertino_ui: ^1.1.7
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^23.0.3
  vibration: ^3.2.1
  intl: ^0.20.3
  cloud_firestore: ^7.2.0
  firebase_auth_web: ^6.4.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/nordland_logo.png
    - assets/images/google_logo.png
    - assets/images/PRODUCTOS/
    - assets/images/PRODUCTOS/AGUA/
    - assets/images/PRODUCTOS/HELADOS/
    - assets/images/PRODUCTOS/LECHES/
    - assets/images/PRODUCTOS/YOGURTS/
